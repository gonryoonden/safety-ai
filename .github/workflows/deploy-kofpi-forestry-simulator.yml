name: Deploy KOFPI Forestry Safety Simulator

on:
  push:
    branches: [main]
    paths:
      - 'kofpi-forestry-safety-simulator/**'
      - '.github/workflows/deploy-kofpi-forestry-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload simulator
        uses: actions/upload-pages-artifact@v3
        with:
          path: kofpi-forestry-safety-simulator

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
